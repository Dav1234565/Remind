<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Remind</title>
  <meta name="theme-color" content="#16cba0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Remind">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" sizes="768x768" href="./assets/remind-logo.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/remind-icon-180.png?v=2">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- חיבור לשרת האייקונים והפונטים של גוגל -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* Palette inspired by shadcn-vue: crisp surfaces, neutral borders, orange accent. */
    .light-theme {
      color-scheme: light;
      --bg-color: #fafafa;
      --text-main: #09090b;
      --text-color: #09090b;
      --muted-color: #71717a;
      --card-bg: #ffffff;
      --card-border: #e4e4e7;
      --card-shadow: rgba(24, 24, 27, 0.045);
      --nav-bg: rgba(255, 255, 255, 0.94);
      --nav-border: #e4e4e7;
      --nav-shadow: rgba(24, 24, 27, 0.1);
      --nav-item-color: #52525b;
      --nav-hover-bg: #f4f4f5;
      --input-bg: #ffffff;
      --accent-color: #f97316;
      --accent-foreground: #ffffff;
      --accent-soft: #fff7ed;
      --field-bg: #ffffff;
      --field-fg: #09090b;
      --sky-gradient: linear-gradient(180deg, #cfddec 0%, #e2ebf4 50%, #eef2f7 100%);
      --mountain-stop-1: #4d698c;
      --mountain-stop-2: #3c5373;
      --mountain-stop-3: #2a3b54;
      --mountain-stop-4: #1e293b;
      --shadow-opacity: 0.35;
      --snow-opacity: 0.9;
    }

    .dark-theme {
      color-scheme: dark;
      --bg-color: #09090b;
      --text-main: #fafafa;
      --text-color: #fafafa;
      --muted-color: #a1a1aa;
      --card-bg: #111113;
      --card-border: #27272a;
      --card-shadow: rgba(0, 0, 0, 0.2);
      --nav-bg: rgba(17, 17, 19, 0.96);
      --nav-border: #27272a;
      --nav-shadow: rgba(0, 0, 0, 0.4);
      --nav-item-color: #d4d4d8;
      --nav-hover-bg: #27272a;
      --input-bg: #18181b;
      --accent-color: #fb923c;
      --accent-foreground: #18181b;
      --accent-soft: #2a1a10;
      --field-bg: #18181b;
      --field-fg: #fafafa;
      --sky-gradient: linear-gradient(180deg, #0b132b 0%, #1c2541 60%, #3a506b 100%);
      --mountain-stop-1: #1d2d44;
      --mountain-stop-2: #131a26;
      --mountain-stop-3: #0b0f19;
      --mountain-stop-4: #05070a;
      --shadow-opacity: 0.6;
      --snow-opacity: 0.6;
    }

    .light-theme,
    .dark-theme {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      padding: 30px 32px 26px;
      overflow: hidden;
      border: 1px solid rgba(228, 228, 236, 0.85);
      border-radius: 26px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 70px rgba(31, 31, 63, 0.1), 0 3px 12px rgba(31, 31, 63, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: authCardEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .auth-container::before {
      display: none;
    }

    .auth-screen {
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        radial-gradient(ellipse at 8% 20%, rgba(170, 132, 235, 0.2), transparent 34%),
        radial-gradient(ellipse at 96% 86%, rgba(246, 190, 130, 0.2), transparent 36%),
        linear-gradient(145deg, #fbfaf9, #f7f6f4);
    }

    .auth-screen::before,
    .auth-screen::after {
      position: absolute;
      z-index: -1;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(166, 132, 235, 0.14), rgba(255, 255, 255, 0.04));
      filter: blur(14px);
      content: "";
    }

    .auth-screen::before {
      top: 8%;
      left: -90px;
    }

    .auth-screen::after {
      right: -100px;
      bottom: 8%;
      width: 280px;
      height: 280px;
    }

    .auth-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .auth-logo > div {
      gap: 10px;
    }

    .auth-logo svg {
      width: 48px;
      height: 48px;
      padding: 8px;
      border: 1px solid #e3e1ef;
      border-radius: 13px;
      background: #f3f1fa;
      filter: none;
    }

    .auth-screen .auth-logo .brand-wordmark {
      background: none;
      color: #242333;
      -webkit-text-fill-color: #242333;
    }

    .auth-screen .auth-logo .brand-tagline {
      color: #777487;
    }

    .auth-heading {
      margin: 0 0 7px;
      color: #242333;
      font-size: clamp(1.5rem, 5vw, 1.75rem);
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .auth-caption {
      margin: 0 0 22px;
      color: #777487;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .auth-mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      margin-bottom: 22px;
      border-radius: 14px;
      background: #f0f3f5;
    }

    .auth-mode-button {
      min-height: 42px;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #69747d;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-mode-button.active {
      background: #fff;
      color: #17212b;
      box-shadow: 0 2px 6px rgba(34, 48, 62, 0.09);
    }

    .auth-field {
      display: block;
      margin-bottom: 13px;
      text-align: right;
    }

    .auth-field > span {
      display: block;
      margin-bottom: 6px;
      color: #555365;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .auth-field input,
    .auth-field textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid #e3e3e9;
      border-radius: 14px;
      outline: none;
      background: #fafafd;
      color: #242333;
      font: inherit;
      font-size: 0.88rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .auth-field textarea {
      min-height: 84px;
      resize: vertical;
    }

    .auth-field input:focus,
    .auth-field textarea:focus {
      border-color: #7164b7;
      box-shadow: 0 0 0 3px rgba(113, 100, 183, 0.13);
    }

    .auth-recovery-group {
      padding: 12px 11px 2px;
      margin: 1px 0 11px;
      border: 1px solid #e7e6ec;
      border-radius: 16px;
      background: rgba(250, 250, 252, 0.82);
      text-align: right;
    }

    .auth-recovery-group legend {
      padding: 0 3px;
      color: #555365;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .auth-recovery-group .auth-field {
      margin-bottom: 7px;
    }

    .auth-recovery-group .auth-field input {
      min-height: 42px;
      text-align: right;
    }

    .auth-password-wrap {
      position: relative;
    }

    .auth-password-wrap input {
      padding-left: 52px;
    }

    .auth-password-toggle {
      position: absolute;
      top: 50%;
      left: 8px;
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #71808a;
      cursor: pointer;
    }

    .auth-password-toggle:hover {
      background: #f0f3f5;
    }

    .auth-submit-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 46px;
      padding: 13px 18px;
      border: 0;
      border-radius: 14px;
      background: #292663;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(41, 38, 99, 0.14);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .auth-submit-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(41, 38, 99, 0.2);
    }

    .auth-submit-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .auth-secondary-button {
      display: block;
      margin: 14px auto 0;
      padding: 7px 10px;
      border: 0;
      background: transparent;
      color: #514a91;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-secondary-button:hover {
      text-decoration: underline;
    }

    .auth-message {
      margin: 0 0 16px;
      padding: 11px 13px;
      border-radius: 11px;
      background: #fff1f0;
      color: #b42318;
      font-size: 0.84rem;
      line-height: 1.55;
      text-align: right;
    }

    .auth-message.success {
      background: #eafaf4;
      color: #087c55;
    }

    .auth-password-hint {
      display: block;
      margin: 8px 2px 12px;
      color: #777487;
      font-size: 0.7rem;
      line-height: 1.5;
    }

    .auth-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 16px;
      color: #777487;
      font-size: 0.7rem;
    }

    .auth-note .material-symbols-rounded {
      font-size: 16px;
      color: #514a91;
    }

    .auth-submit-button:focus-visible,
    .auth-secondary-button:focus-visible,
    .auth-mode-button:focus-visible,
    .auth-password-toggle:focus-visible {
      outline: 3px solid rgba(81, 74, 145, 0.35);
      outline-offset: 3px;
    }

    @keyframes authCardEnter {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 420px) {
      .auth-container {
        padding: 28px 22px 22px;
        border-radius: 24px;
      }

      .auth-logo { margin-bottom: 17px; }
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.4s ease, color 0.4s ease;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button, a, input, textarea {
      -webkit-tap-highlight-color: transparent;
    }

    /* כרטיסי זכוכית בועתיים (Frosted Glass) */
    .apple-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 22px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px var(--card-shadow);
      transition: all 0.3s ease;
    }

    .brand-wordmark {
      background: linear-gradient(100deg, #f4fffb 12%, #20e3a2 58%, #20b7d9 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .brand-tagline {
      color: #20d2b0;
    }

    .light-theme .brand-wordmark {
      background-image: linear-gradient(100deg, #1d1d1f 12%, #089b78 58%, #078eaa 100%);
    }

    .light-theme .brand-tagline {
      color: #078e78;
    }

    /* סרגל הניווט בתחתית */
    .nav-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
    }
    .apple-navbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border-radius: 28px;
      background: var(--nav-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--nav-border);
      box-shadow: 0 12px 40px var(--nav-shadow);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      color: var(--nav-item-color);
      font-size: 11px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .nav-item:hover {
      background: var(--nav-hover-bg);
      transform: translateY(-4px) scale(1.1);
    }
    .nav-item.active {
      background: rgba(0, 122, 255, 0.15);
      color: #007aff;
      border: 1px solid rgba(0, 122, 255, 0.3);
    }

    /* מיכל ההר הווקטורי ואנימציות */
    .mountain-app-container {
      position: relative;
      width: 100%;
      height: 520px;
      background: var(--sky-gradient);
      overflow: hidden;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      transition: background 1s ease;
    }

    .sun-glow {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255,145,145,0.3) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
    }

    .mountain-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .weekly-day-button {
      box-sizing: border-box;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .mountain-peak-flag {
      position: absolute;
      top: 0;
      left: 50%;
      width: 28px;
      height: 36px;
      transform: translate(-50%, -100%);
      animation: peakFlagBounce 1s infinite;
    }

    .mountain-peak-flag-cloth {
      transform-box: view-box;
      transform-origin: 15px 2px;
      animation: peakFlagFlutter 1.2s ease-in-out infinite;
    }

    @keyframes peakFlagBounce {
      0%, 100% { transform: translate(-50%, -100%); }
      50% { transform: translate(-50%, calc(-100% - 8px)); }
    }

    @keyframes peakFlagFlutter {
      0%, 100% { transform: rotate(0deg) skewY(0deg); }
      35% { transform: rotate(8deg) skewY(5deg); }
      70% { transform: rotate(-4deg) skewY(-2deg); }
    }

    .cloud {
      position: absolute;
      font-size: 28px;
      opacity: 0.25;
      z-index: 1;
    }
    .cloud-1 { top: 15%; animation: moveCloud 25s linear infinite; }
    .cloud-2 { top: 25%; animation: moveCloud 35s linear infinite; animation-delay: -10s; }

    @keyframes moveCloud {
      0% { left: -10%; transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { left: 110%; transform: scale(1); }
    }

    .assistant-launcher {
      position: fixed;
      z-index: 45;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(26px, env(safe-area-inset-bottom));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 8px 26px rgba(37, 99, 235, 0.32);
      cursor: pointer;
    }

    .assistant-launcher .material-symbols-rounded {
      font-size: 22px;
    }

    .assistant-panel {
      position: fixed;
      z-index: 44;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(86px, calc(60px + env(safe-area-inset-bottom)));
      display: flex;
      flex-direction: column;
      width: min(390px, calc(100vw - 32px));
      height: min(560px, calc(100dvh - 120px - env(safe-area-inset-bottom)));
      overflow: hidden;
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(24px);
    }

    .assistant-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .assistant-icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--input-bg);
      cursor: pointer;
    }

    .assistant-icon-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .assistant-privacy {
      margin: 0;
      padding: 10px 16px;
      color: var(--text-color);
      font-size: 11px;
      line-height: 1.5;
      opacity: 0.7;
    }

    .assistant-messages {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      padding: 12px 16px;
      overscroll-behavior: contain;
    }

    .assistant-message {
      max-width: 88%;
      margin: 0;
      padding: 10px 12px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant-message-user {
      align-self: flex-start;
      border-bottom-right-radius: 5px;
      background: #2563eb;
      color: #fff;
    }

    .assistant-message-ai {
      align-self: flex-end;
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 5px;
      background: var(--input-bg);
    }

    .assistant-empty {
      margin: auto;
      padding: 20px;
      text-align: center;
      opacity: 0.65;
    }

    .assistant-error {
      margin: 0;
      padding: 0 16px 8px;
      color: #dc2626;
      font-size: 12px;
    }

    .assistant-form {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--card-border);
    }

    .assistant-form textarea {
      min-height: 44px;
      max-height: 110px;
      flex: 1;
      resize: vertical;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: var(--input-bg);
      color: var(--text-color);
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
    }

    .assistant-form button {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .assistant-form button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      #root > div {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .onboarding-shell {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .onboarding-card {
        padding: 1.25rem !important;
        border-radius: 20px;
      }

      .app-shell {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .app-content {
        width: 100%;
        max-width: 64rem;
      }

      .app-header {
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }

      .greeting-pill {
        max-width: 54vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timer-card {
        gap: 1.5rem !important;
        padding: 1.25rem !important;
      }

      .timer-clock {
        width: min(16rem, 100%);
        height: auto;
        aspect-ratio: 1;
        flex-shrink: 0;
      }

      .week-selector {
        width: 100%;
        gap: 0.25rem;
      }

      .week-option {
        flex: 1;
        padding-inline: 0.25rem !important;
        white-space: nowrap;
        font-size: 0.68rem !important;
      }

      .mountain-map {

        'raw',

        false,
        ['deriveBits']
      );
      const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 310000 },

        256
      );
      return new Uint8Array(bits);

      const actualHash = await hashLocalPassword(password, fromBase64Url(savedLock.salt));

    const derEcdsaSignatureToP1363 = (derSignature) => {
      const der = new Uint8Array(derSignature);
      if (der.length < 8 || der[0] !== 0x30) throw new Error('חתימת Face ID אינה תקינה.');
      let index = 2;
      if (der[index++] !== 0x02) throw new Error('חתימת Face ID אינה תקינה.');
      const rLength = der[index++];
      const r = der.slice(index, index + rLength);
      index += rLength;
      if (der[index++] !== 0x02) throw new Error('חתימת Face ID אינה תקינה.');
      const sLength = der[index++];
      const s = der.slice(index, index + sLength);
      const raw = new Uint8Array(64);
      raw.set(r.slice(Math.max(0, r.length - 32)), 32 - Math.min(32, r.length));

      return raw;

    const verifyLocalWebAuthnAssertion = async (credential, storedCredential, challenge) => {
      const response = credential.response;
      const clientData = JSON.parse(new TextDecoder().decode(response.clientDataJSON));
      const expectedChallenge = toBase64Url(challenge);
      if (clientData.type !== 'webauthn.get' ||
          clientData.challenge !== expectedChallenge ||
          clientData.origin !== window.location.origin) {
        return false;
      }

      const authenticatorData = new Uint8Array(response.authenticatorData);
      const expectedRpIdHash = new Uint8Array(
        await crypto.subtle.digest('SHA-256', new TextEncoder().encode(window.location.hostname))
      );
      if (authenticatorData.length < 37 ||
          !expectedRpIdHash.every((byte, index) => byte === authenticatorData[index]) ||
          (authenticatorData[32] & 0x05) !== 0x05) {
        return false;
      }

      const clientDataHash = new Uint8Array(await crypto.subtle.digest('SHA-256', response.clientDataJSON));
      const signedData = new Uint8Array(authenticatorData.length + clientDataHash.length);
      signedData.set(authenticatorData);
      signedData.set(clientDataHash, authenticatorData.length);

      const algorithm = storedCredential.algorithm === -7
        ? { name: 'ECDSA', namedCurve: 'P-256' }
        : storedCredential.algorithm === -257
          ? { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }
          : null;
      if (!algorithm) return false;

      const publicKey = await crypto.subtle.importKey(
        'spki',
        fromBase64Url(storedCredential.publicKey),
        algorithm,
        false,
        ['verify']
      );
      const signature = storedCredential.algorithm === -7
        ? derEcdsaSignatureToP1363(response.signature)
        : response.signature;
      const verifyAlgorithm = storedCredential.algorithm === -7
        ? { name: 'ECDSA', hash: 'SHA-256' }
        : { name: 'RSASSA-PKCS1-v1_5' };
      return crypto.subtle.verify(verifyAlgorithm, publicKey, signature, signedData);
    };

          return;
        }
        if (!window.isSecureContext || !('serviceWorker' in navigator) || !('PushManager' in window)) {
          setNotificationStatus('התראות זמינות רק באתר מאובטח (HTTPS) או ב־localhost.');
          return;
        }

        try {
          const permission = Notification.permission === 'default'
            ? await Notification.requestPermission()
            : Notification.permission;
          if (permission !== 'granted') {
            setNotificationStatus('יש לאשר התראות בהגדרות הדפדפן כדי להפעיל תזכורות.');
            return;
          }

          await navigator.serviceWorker.register('./sw.js');
          const registration = await navigator.serviceWorker.ready;
          let subscription = await registration.pushManager.getSubscription();
          if (!subscription) {
            const { vapidPublicKey } = await fetchPushFunction({ action: 'public-key' });
            if (!vapidPublicKey) throw new Error('שירות ההתראות לא הוגדר עם מפתח Push ציבורי.');
            subscription = await registration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: decodeVapidPublicKey(vapidPublicKey)
            });
          }

          await fetchPushFunction({
            action: 'subscribe',
            installationId: getPushInstallationId(),
            subscription: subscription.toJSON(),
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC',
            siteUrl: new URL('./', window.location.href).toString()
          });
          await sendTimeMotivationNotification();
          localStorage.setItem(HOURLY_REMINDERS_KEY, 'true');
          setHourlyRemindersEnabled(true);
          setNotificationStatus('התזכורות השעתיות הופעלו, גם כשהאתר סגור. נשלחה התראת בדיקה.');
        } catch (error) {
          console.error('Could not enable hourly Remind notifications:', error);
          setNotificationStatus(error.message || 'לא ניתן להפעיל התראות Push. בדוק/י את הגדרות Supabase ואת הרשאות הדפדפן.');
        }
      };

      const handleDisableHourlyReminders = async () => {

          const subscription = await registration.pushManager.getSubscription();
          if (subscription) await subscription.unsubscribe();
          localStorage.removeItem(HOURLY_REMINDERS_KEY);
          setHourlyRemindersEnabled(false);
          setNotificationStatus('התזכורות השעתיות כובו.');

      useEffect(() => {

      const handleCreateLocalLock = async (event) => {
        event.preventDefault();
        setLockError('');
        const name = lockName.trim();
        if (!name) {
          setLockError('יש להזין את השם שלך.');
          return;
        }
        if (lockPassword.length < 8) {
          setLockError('הסיסמה צריכה להכיל לפחות 8 תווים.');
          return;
        }
        if (lockPassword !== lockPasswordConfirmation) {
          setLockError('אימות הסיסמה אינו תואם לסיסמה שהוזנה.');
          return;
        }
        if (recoveryAnswers.some((answer) => !answer.trim())) {
          setLockError('יש למלא תשובה לכל שלוש שאלות השחזור.');
          return;
        }

        setLockSubmitting(true);
        try {
          const salt = randomBytes(16);
          const passwordHash = await hashLocalPassword(lockPassword, salt);
          const hashedRecoveryAnswers = await createRecoveryAnswers(recoveryAnswers);
          const nextLock = {
            salt: toBase64Url(salt),
            passwordHash: toBase64Url(passwordHash),
            credential: null,
            recoveryAnswers: hashedRecoveryAnswers
          };
          const nextProfile = { ...profile, name };
          localStorage.setItem(LOCAL_PROFILE_KEY, JSON.stringify(nextProfile));
          localStorage.setItem(accountStorageKey('registered'), 'true');
          localStorage.setItem(LOCAL_LOCK_KEY, JSON.stringify(nextLock));
          sessionStorage.setItem(LOCAL_UNLOCKED_KEY, 'true');
          setLocalLock(nextLock);

        }

          if (!passwordMatches) {

          const salt = randomBytes(16);

          setLockSubmitting(false);
        }

      const handleSaveRecoveryAnswers = async (event) => {

          setLockSubmitting(false);

      const handleEnableFaceId = async () => {
        setLockError('');
        setLockSubmitting(true);
        try {
          if (!window.isSecureContext || !navigator.credentials?.create || !window.PublicKeyCredential) {
            setLockError('Face ID זמין רק בדפדפן תומך ובחיבור מאובטח (HTTPS).');
            return;
          }

          const challenge = randomBytes(32);
          const credential = await navigator.credentials.create({
            publicKey: {
              challenge,
              rp: { name: 'Remind', id: window.location.hostname },
              user: {
                id: randomBytes(16),
                name: profile.name || lockName || 'Remind user',
                displayName: profile.name || lockName || 'Remind'
              },
              pubKeyCredParams: [
                { type: 'public-key', alg: -7 },
                { type: 'public-key', alg: -257 }
              ],
              authenticatorSelection: {
                authenticatorAttachment: 'platform',
                residentKey: 'preferred',
                userVerification: 'required'
              },
              timeout: 60000,
              attestation: 'none'
            }
          });
          if (!(credential instanceof PublicKeyCredential)) {
            setLockError('לא הוגדר אמצעי זיהוי במכשיר.');
            return;
          }

          const response = credential.response;
          const publicKey = response.getPublicKey?.();
          const algorithm = response.getPublicKeyAlgorithm?.();
          if (!publicKey || ![-7, -257].includes(algorithm)) {
            setLockError('המכשיר לא סיפק מפתח Face ID נתמך. אפשר להמשיך להשתמש בסיסמה.');
            return;
          }

          const nextLock = {
            ...(localLock || readLocalLock()),
            credential: {
              id: toBase64Url(credential.rawId),
              publicKey: toBase64Url(publicKey),
              algorithm
            }
          };
          localStorage.setItem(LOCAL_LOCK_KEY, JSON.stringify(nextLock));
          setLocalLock(nextLock);
          setBiometricAvailable(true);
          setLockError('');
        } catch (error) {
          console.error('Could not enable Face ID:', error);
          setLockError(error.name === 'NotAllowedError'
            ? 'Face ID בוטל או לא אושר. אפשר לנסות שוב או להשתמש בסיסמה.'
            : 'לא ניתן להגדיר Face ID במכשיר זה. אפשר להמשיך להשתמש בסיסמה.');
        } finally {
          setLockSubmitting(false);
        }
      };

      const handleFaceIdUnlock = async () => {
        setLockError('');
        setLockSubmitting(true);
        try {
          const credentialData = localLock?.credential;
          if (!credentialData || !navigator.credentials?.get) {
            setLockError('Face ID לא הוגדר במכשיר זה. התחבר באמצעות הסיסמה.');
            return;
          }

          const challenge = randomBytes(32);
          const credential = await navigator.credentials.get({
            publicKey: {
              challenge,
              rpId: window.location.hostname,
              allowCredentials: [{ type: 'public-key', id: fromBase64Url(credentialData.id) }],
              userVerification: 'required',
              timeout: 60000
            }
          });
          if (!(credential instanceof PublicKeyCredential)) {
            setLockError('לא התקבל אישור זיהוי מהמכשיר. נסה שוב עם הסיסמה.');
            return;
          }
          const isValid = await verifyLocalWebAuthnAssertion(credential, credentialData, challenge);
          if (!isValid) {
            setLockError('Face ID לא אומת. אפשר לנסות שוב או להשתמש בסיסמה.');
            return;
          }
          sessionStorage.setItem(LOCAL_UNLOCKED_KEY, 'true');
          setIsUnlocked(true);
        } catch (error) {
          console.error('Could not verify Face ID:', error);
          setLockError(error.name === 'NotAllowedError'
            ? 'זיהוי Face ID בוטל. אפשר לנסות שוב או להשתמש בסיסמה.'
            : 'לא ניתן לאמת Face ID. אפשר לנסות שוב או להשתמש בסיסמה.');
        } finally {
          setLockSubmitting(false);
        }
      };

      const handleLockApp = () => {
        sessionStorage.removeItem(LOCAL_UNLOCKED_KEY);
        setLockError('');
        setAssistantOpen(false);
        setIsUnlocked(false);
        setActiveTab('timer');

      const handleDayAnswer = (dayNum, answer) => {

        if (currentStatus === answer) {

        localStorage.setItem(accountStorageKey(currentMonthKey), JSON.stringify(updated));
        setShowDayModal(false);

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        setIsDrawing(true);
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        ctx.beginPath();
        ctx.moveTo((clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY);
        ctx.strokeStyle = '#007aff';
        ctx.lineWidth = 3 * scaleX;
        ctx.lineCap = 'round';
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        ctx.lineTo((clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY);
        ctx.stroke();
        setHasSigned(true);
      };

      const stopDrawing = () => {

      if (authLoading) {

          </div>

      if (!isUnlocked) {

        return (
          <div className={`auth-screen onboarding-shell min-h-screen flex items-center justify-center p-4 ${currentTheme}`} dir="rtl">
            <section className="auth-container apple-card shadow-2xl" aria-labelledby="local-lock-heading">
              <div className="auth-logo"><RemindLogo size="lg" /></div>
              <h1 id="local-lock-heading" className="auth-heading">
                {isFirstSetup ? 'מרחב אישי חדש' : getGreeting(clock, profile.name || lockName)}
              </h1>
              <p className="auth-caption">
                {isFirstSetup

                  : unlockMode === 'recovery'

                    : 'הזן/י את הסיסמה או השתמש/י ב־Face ID כדי להמשיך.'}
              </p>
              {isFirstSetup ? (
                <form onSubmit={handleCreateLocalLock}>

                    <span>השם שלך</span>

                      placeholder="איך לקרוא לך?"
                    />
                  </label>
                  <label className="auth-field">
                    <span>יצירת סיסמה</span>
                    <input

                {assistantMessages.length === 0 && (
                  <p className="assistant-empty">
                    היי{profile.name ? ` ${profile.name}` : ''}! איך אפשר לעזור לך היום?
                  </p>
                )}
                {assistantMessages.map((item, index) => (
                  <p
                    key={`${index}-${item.role}`}
                    className={`assistant-message ${item.role === 'user' ? 'assistant-message-user' : 'assistant-message-ai'}`}
                  >
                    {item.text}
                  </p>
                ))}
                {assistantSending && (
                  <p className="assistant-message assistant-message-ai" role="status">העוזר חושב...</p>
                )}
              </div>
              {assistantError && <p className="assistant-error" role="alert">{assistantError}</p>}
              <form className="assistant-form" onSubmit={handleSendAssistantMessage}>
                <textarea
                  value={assistantDraft}
                  onChange={(event) => setAssistantDraft(event.target.value)}
                  placeholder="כתוב/י הודעה לעוזר..."
                  aria-label="הודעה לעוזר"
                  maxLength={1200}
                  rows={2}
                  disabled={assistantSending}
                />
                <button
                  type="submit"
                  disabled={!assistantDraft.trim() || assistantSending}
                  aria-label="שליחת הודעה"
                >
                  <span className="material-symbols-rounded" aria-hidden="true">send</span>
                </button>
              </form>
            </section>
          )}

          {/* --- מודאל שאלון יומי --- */}
          {showDayModal && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="modal-panel apple-card p-6 max-w-sm w-full space-y-6 text-center shadow-2xl">
                <div className="space-y-2">
                  <span className="text-xs text-blue-500 font-bold uppercase tracking-wider">יומן טיפוס ההר</span>
                  <h3 className="text-xl font-bold">האם עמדת ביעד ביום {selectedDay}?</h3>
                  <p className="text-xs opacity-70">בחירה מחדש תעדכן את הסטטוס.</p>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button onClick={() => handleDayAnswer(selectedDay, 'yes')} className="py-3.5 rounded-2xl font-bold text-sm bg-emerald-500 hover:bg-emerald-600 text-zinc-950 transition-all shadow-md active:scale-95">
                    ✅ כן, עמדתי!
                  </button>
                  <button onClick={() => handleDayAnswer(selectedDay, 'no')} className="py-3.5 rounded-2xl font-bold text-sm bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/30 text-rose-500 transition-all active:scale-95">
                    ❌ פספסתי
                  </button>
                </div>

                <button onClick={() => setShowDayModal(false)} className="text-xs opacity-60 hover:opacity-100 pt-2 block mx-auto">סגור חלון</button>
              </div>
            </div>
          )}

          {/* מודאל איפוס טיימר */}
          {showResetModal && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="modal-panel apple-card p-6 max-w-md w-full space-y-4">
                <h3 className="text-lg font-bold">דיווח נפילה ואיפוס טיימר</h3>
                <div className="space-y-2">
                  {COMMON_TRIGGER_REASONS.map((cat) => (
                    <button key={cat} onClick={() => setSelectedCategory(cat)} className={`w-full p-2.5 rounded-xl border text-right text-xs transition-all ${selectedCategory === cat ? 'border-blue-500 font-bold text-blue-500 bg-blue-500/10' : 'border-[var(--card-border)] opacity-70'}`}>
                      {cat}
                    </button>
                  ))}
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={handleConfirmReset} className="flex-1 py-2.5 rounded-xl bg-blue-500 text-white font-medium text-xs shadow-md active:scale-95">אישור ואיפוס</button>
                  <button onClick={() => setShowResetModal(false)} className="px-4 py-2.5 rounded-xl bg-[var(--input-bg)] opacity-70 hover:opacity-100 font-medium text-xs">ביטול</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RemindApp />);
  </script>
</body>
</html>
