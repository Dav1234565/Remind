<!DOCTYPE html>

<head>

  <style>
    /* משתני צבעים דינמיים למצב בהיר / כהה בסגנון אפל */
    .light-theme {
      --bg-color: #f5f5f7;
      --text-main: #1d1d1f;
      --card-bg: rgba(255, 255, 255, 0.55);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: rgba(0, 0, 0, 0.05);
      --nav-bg: rgba(255, 255, 255, 0.65);
      --nav-border: rgba(0, 0, 0, 0.12);
      --nav-shadow: rgba(0, 0, 0, 0.1);
      --nav-item-color: #3a3a3c;
      --nav-hover-bg: rgba(0, 0, 0, 0.06);
      --input-bg: rgba(255, 255, 255, 0.72);
      --sky-gradient: linear-gradient(180deg, #cfddec 0%, #e2ebf4 50%, #eef2f7 100%);
      --mountain-stop-1: #4d698c;
      --mountain-stop-2: #3c5373;
      --mountain-stop-3: #2a3b54;
      --mountain-stop-4: #1e293b;
      --shadow-opacity: 0.35;
      --snow-opacity: 0.9;
    }

    .dark-theme {
      --bg-color: #000000;
      --text-main: #1d1d1f;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.1);
      --card-shadow: rgba(255, 255, 255, 0.08);
      --nav-bg: #ffffff;
      --nav-border: rgba(0, 0, 0, 0.12);
      --nav-shadow: rgba(255, 255, 255, 0.12);
      --nav-item-color: #3a3a3c;
      --nav-hover-bg: rgba(0, 0, 0, 0.06);
      --input-bg: #ffffff;
      --sky-gradient: linear-gradient(180deg, #0b132b 0%, #1c2541 60%, #3a506b 100%);
      --mountain-stop-1: #1d2d44;
      --mountain-stop-2: #131a26;
      --mountain-stop-3: #0b0f19;
      --mountain-stop-4: #05070a;
      --shadow-opacity: 0.6;
      --snow-opacity: 0.6;
    }

    .dark-theme button {
      background-color: #ffffff !important;
      border-color: rgba(0, 0, 0, 0.12) !important;
      color: #1d1d1f !important;
    }

    .light-theme,
    .dark-theme {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .google-auth-container {
      position: relative;
      z-index: 1;
      width: min(100%, 380px);
      padding: 40px 32px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 28px 80px rgba(28, 38, 65, 0.16), 0 4px 14px rgba(28, 38, 65, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      animation: authCardEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .google-auth-container::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 5px;
      background: linear-gradient(90deg, #20b7d9, #20e3a2, #20b7d9);
      content: "";
    }

    .google-auth-screen {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(32, 227, 162, 0.15), transparent 34%),
        radial-gradient(ellipse at 82% 82%, rgba(32, 183, 217, 0.14), transparent 38%),
        linear-gradient(145deg, #f8fafc, #edf2f7);
    }

    .google-auth-screen::before,
    .google-auth-screen::after {
      position: absolute;
      z-index: -1;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(32, 227, 162, 0.18), rgba(32, 183, 217, 0.08));
      filter: blur(2px);
      content: "";
    }

    .google-auth-screen::before {
      top: 8%;
      left: -90px;
    }

    .google-auth-screen::after {
      right: -100px;
      bottom: 8%;
      width: 280px;
      height: 280px;
    }

    .google-auth-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .google-auth-heading {
      margin: 0 0 10px;
      color: #17212b;
      font-size: clamp(1.55rem, 5vw, 1.85rem);
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .google-auth-caption {
      margin: 0 0 28px;
      color: #687581;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .google-auth-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 20px;
      color: #7b8791;
      font-size: 0.75rem;
    }

    .google-auth-note .material-symbols-rounded {
      font-size: 16px;
      color: #14a985;
    }

    .google-login-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background-color: #ffffff;
      color: #3c4043;
      border: 1px solid #dfe4e8;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(34, 48, 62, 0.05);

    .google-login-button:hover {
      background-color: #f8f9fa;
      border-color: #d2e3fc;
      box-shadow: 0 8px 20px rgba(34, 48, 62, 0.1);
      transform: translateY(-1px);

    .google-login-button:disabled {
      cursor: wait;
    }

    .google-login-button:focus-visible {
      outline: 3px solid rgba(0, 122, 255, 0.35);
      outline-offset: 3px;
    }

    @keyframes authCardEnter {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }

    @media (max-width: 420px) {

        border-radius: 24px;

    body {

      color: var(--text-main);

      min-height: 100%;
      -webkit-text-size-adjust: 100%;

    *, *::before, *::after {
      box-sizing: border-box;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button, a, input, textarea {

    /* כרטיסי זכוכית בועתיים (Frosted Glass) */

      -webkit-background-clip: text;

    .light-theme .brand-tagline {
      color: #078e78;
    }

    /* סרגל הניווט בתחתית */
    .nav-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
    }
    .apple-navbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border-radius: 28px;
      background: var(--nav-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--nav-border);
      box-shadow: 0 12px 40px var(--nav-shadow);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      color: var(--nav-item-color);
      font-size: 11px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .nav-item:hover {
      background: var(--nav-hover-bg);
      transform: translateY(-4px) scale(1.1);
    }
    .nav-item.active {
      background: rgba(0, 122, 255, 0.15);
      color: #007aff;
      border: 1px solid rgba(0, 122, 255, 0.3);
    }

    /* מיכל ההר הווקטורי ואנימציות */
    .mountain-app-container {
      position: relative;
      width: 100%;
      height: 520px;
      background: var(--sky-gradient);
      overflow: hidden;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      transition: background 1s ease;
    }

    .sun-glow {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255,145,145,0.3) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
    }

    .mountain-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .weekly-day-button {
      box-sizing: border-box;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .mountain-peak-flag {
      position: absolute;
      top: 0;
      left: 50%;
      width: 28px;
      height: 36px;
      transform: translate(-50%, -100%);
      animation: peakFlagBounce 1s infinite;
    }

    .mountain-peak-flag-cloth {
      transform-box: view-box;
      transform-origin: 15px 2px;
      animation: peakFlagFlutter 1.2s ease-in-out infinite;
    }

    @keyframes peakFlagBounce {
      0%, 100% { transform: translate(-50%, -100%); }
      50% { transform: translate(-50%, calc(-100% - 8px)); }
    }

    @keyframes peakFlagFlutter {
      0%, 100% { transform: rotate(0deg) skewY(0deg); }
      35% { transform: rotate(8deg) skewY(5deg); }
      70% { transform: rotate(-4deg) skewY(-2deg); }
    }

    .cloud {
      position: absolute;
      font-size: 28px;
      opacity: 0.25;
      z-index: 1;
    }
    .cloud-1 { top: 15%; animation: moveCloud 25s linear infinite; }
    .cloud-2 { top: 25%; animation: moveCloud 35s linear infinite; animation-delay: -10s; }

    @keyframes moveCloud {
      0% { left: -10%; transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { left: 110%; transform: scale(1); }
    }

    @media (max-width: 640px) {
      #root > div {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .onboarding-shell {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .onboarding-card {
        padding: 1.25rem !important;
        border-radius: 20px;
      }

      .app-shell {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .app-content {
        width: 100%;
        max-width: 64rem;
      }

      .app-header {
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }

      .greeting-pill {
        max-width: 54vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timer-card {
        gap: 1.5rem !important;
        padding: 1.25rem !important;
      }

      .timer-clock {
        width: min(16rem, 100%);
        height: auto;
        aspect-ratio: 1;
        flex-shrink: 0;
      }

      .week-selector {
        width: 100%;
        gap: 0.25rem;
      }

      .week-option {
        flex: 1;
        padding-inline: 0.25rem !important;
        white-space: nowrap;
        font-size: 0.68rem !important;
      }

      .mountain-map {
        height: clamp(400px, 72dvh, 540px) !important;
      }

      .settings-theme-options {
        grid-template-columns: 1fr !important;
        gap: 0.5rem;
      }

      .settings-panel {
        width: 100%;
        padding: 1rem !important;
        margin-inline: auto;
        overflow-wrap: anywhere;
      }

      .settings-panel button,
      .settings-panel input,
      .settings-panel textarea {
        min-height: 44px;
      }

      .settings-panel textarea {
        min-height: 72px;
      }

      .nav-container {
        bottom: calc(10px + env(safe-area-inset-bottom));
        width: min(92vw, 360px);
      }

      .apple-navbar {
        width: 100%;
        justify-content: space-around;
        gap: 4px;
        padding: 6px 8px;
      }

      .nav-item {
        width: auto;
        min-width: 0;
        min-height: 48px;
        flex: 1;
      }

      .modal-backdrop {
        align-items: flex-end;
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .modal-panel {
        max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 1.25rem !important;
      }

      input, textarea, select {
        font-size: 16px !important;
      }
    }

    @media (max-width: 360px) {
      .timer-card {
        padding: 1rem !important;
      }

      .week-option {
        font-size: 0.62rem !important;
      }

      .mountain-map {
        height: 420px !important;
      }
    }
  </style>
</head>
<body class="min-h-screen selection:bg-blue-500/30">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const supabase = window.supabase.createClient(
      'https://lguuxrwjwwzxkhydjryo.supabase.co',
      'sb_publishable_mOtrogkoIlfugUNztuFyYA_yN7T-av8',
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const COMMON_TRIGGER_REASONS = [
      "עייפות קיצונית / חוסר שינה",
      "לחץ נפשי או חרדה פתאומים",
      "שיעמום או זמן פנוי ללא מסגרת",
      "טריגר סביבתי / חשיפה לגירוי",
      "תחושת תסכול או כעס",
      "אחר (פירוט חופשי)"
    ];

    function RemindLogo({ size = "md" }) {
      const dimensions = size === "sm" ? "w-10 h-10" : size === "lg" ? "w-20 h-20" : "w-14 h-14";
      const wordmarkSize = size === "lg" ? "text-2xl" : "text-lg";
      
      return (
        <div className="flex items-center gap-3">
          <svg className={`${dimensions} shrink-0 drop-shadow-[0_0_8px_rgba(29,233,182,0.2)]`} viewBox="0 0 100 100" fill="none" role="img" aria-label="סמל Remind: מוח, הר והתקדמות">
            <defs>
              <linearGradient id="remind-logo-gradient" x1="13" y1="18" x2="88" y2="84" gradientUnits="userSpaceOnUse">
                <stop stopColor="#20E3A2" />
                <stop offset="1" stopColor="#20B7D9" />
              </linearGradient>
            </defs>
            <path d="M75 15a41 41 0 1 0 10 57" stroke="url(#remind-logo-gradient)" strokeWidth="4" strokeLinecap="round" />
            <path d="m76 61 11 11-15 2" stroke="url(#remind-logo-gradient)" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
            <path d="M48 22c-7-8-20-4-20 6-10 1-13 13-7 19-8 8-3 21 7 22 2 10 15 13 21 4V22Z" stroke="url(#remind-logo-gradient)" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" />
            <path d="M32 33c5-4 12-1 13 5m-17 8c5-3 12-1 14 4m-13 9c5 0 9 3 10 8" stroke="url(#remind-logo-gradient)" strokeWidth="3" strokeLinecap="round" />
            <path d="m48 68 17-28 8 12 5-7 11 18" stroke="url(#remind-logo-gradient)" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" />
            <path d="m61 48 4-5 4 6 3-3 4 6" stroke="url(#remind-logo-gradient)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
          <div className="flex flex-col text-right">
            <span className={`brand-wordmark ${wordmarkSize} font-black tracking-tight leading-none`}>Remind</span>
            <span className="brand-tagline text-[10px] font-medium tracking-wider uppercase">חוסן ואיזון</span>
          </div>
        </div>
      );
    }

    function RemindApp() {
      const [authUser, setAuthUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [userDataReady, setUserDataReady] = useState(false);
      const [authError, setAuthError] = useState('');
      const [authSubmitting, setAuthSubmitting] = useState(false);
      const [isRegistered, setIsRegistered] = useState(false);
      const [onboardingError, setOnboardingError] = useState('');
      const [profile, setProfile] = useState({
        name: '',
        age: '',
        gender: 'זכר',
        promise: '',
        signatureDataUrl: '',
        email: ''
      });

      const [themeMode, setThemeMode] = useState('auto');

      const [currentTheme, setCurrentTheme] = useState('dark-theme');

      useEffect(() => {
        const updateTheme = () => {
          if (themeMode === 'light') {
            setCurrentTheme('light-theme');
          } else if (themeMode === 'dark') {
            setCurrentTheme('dark-theme');
          } else {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 18) {
              setCurrentTheme('light-theme');
            } else {
              setCurrentTheme('dark-theme');
            }
          }
        };
        updateTheme();
        const interval = setInterval(updateTheme, 60000);
        return () => clearInterval(interval);
      }, [themeMode]);

      const [activeTab, setActiveTab] = useState('timer');

      const todayDate = new Date();
      const currentMonthKey = `eitan_month_${todayDate.getFullYear()}_${todayDate.getMonth() + 1}`;
      
      const [selectedWeek, setSelectedWeek] = useState(1);
      const [monthLogs, setMonthLogs] = useState({});

      const [selectedDay, setSelectedDay] = useState(null);
      const [showDayModal, setShowDayModal] = useState(false);

      const [onboardingStep, setOnboardingStep] = useState(1);

      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasSigned, setHasSigned] = useState(false);

      const [startTime, setStartTime] = useState(Date.now());
      const [logs, setLogs] = useState([]);

      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [showResetModal, setShowResetModal] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState(COMMON_TRIGGER_REASONS[0]);
      const [resetReason, setResetReason] = useState('');
      const authUserIdRef = useRef(null);

      const accountStorageKey = (key, userId = authUser?.id) => (
        userId ? `remind:${userId}:${key}` : null
      );

      useEffect(() => {
        let isMounted = true;
        const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
          if (isMounted) {
            if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
              setAuthError('');
              setAuthSubmitting(false);
            }
            const nextUser = session?.user || null;
            const nextUserId = nextUser?.id || null;
            if (authUserIdRef.current !== nextUserId) {
              authUserIdRef.current = nextUserId;
              setUserDataReady(false);
            }
            setAuthUser(nextUser);
            setAuthLoading(false);
          }
        });

        supabase.auth.getSession()
          .then(({ data, error }) => {
            if (!isMounted) return;
            if (error) {
              setAuthError('לא ניתן לבדוק את מצב ההתחברות. נסה לרענן את הדף.');
              console.error('Supabase session check failed:', error.message);
            }
            const nextUser = data?.session?.user || null;
            const nextUserId = nextUser?.id || null;
            if (authUserIdRef.current !== nextUserId) {
              authUserIdRef.current = nextUserId;
              setUserDataReady(false);
            }
            setAuthUser(nextUser);
            setAuthLoading(false);
          })
          .catch((error) => {
            if (!isMounted) return;
            console.error('Supabase session check request failed:', error);
            setAuthError('לא ניתן לבדוק את מצב ההתחברות. בדוק את החיבור ונסה לרענן.');
            authUserIdRef.current = null;
            setAuthUser(null);
            setAuthLoading(false);
          });

        return () => {
          isMounted = false;
          subscription.unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!authUser) {
          setUserDataReady(false);
          setIsRegistered(false);
          setProfile({
            name: '',
            age: '',
            gender: 'זכר',
            promise: '',
            signatureDataUrl: '',
            email: ''
          });
          return;
        }

        const userId = authUser.id;
        const readAccountValue = (key) => localStorage.getItem(accountStorageKey(key, userId));
        const savedProfile = readAccountValue('profile');
        const metadata = authUser.user_metadata || {};
        let localProfile = {};
        try {
          localProfile = savedProfile ? JSON.parse(savedProfile) : {};
        } catch (error) {
          console.error('Saved profile is invalid:', error);
        }

        setProfile({
          name: metadata.name || metadata.full_name || metadata.preferred_username || localProfile.name || '',
          age: localProfile.age || '',
          gender: localProfile.gender || 'זכר',
          promise: metadata.promise || localProfile.promise || '',
          signatureDataUrl: localProfile.signatureDataUrl || '',
          email: authUser.email || ''
        });
        setThemeMode(readAccountValue('theme_mode') || 'auto');

        const savedStartTime = Number(readAccountValue('streak_start'));
        const nextStartTime = Number.isFinite(savedStartTime) && savedStartTime > 0
          ? savedStartTime
          : Date.now();
        setStartTime(nextStartTime);
        if (!savedStartTime) {
          localStorage.setItem(accountStorageKey('streak_start', userId), String(nextStartTime));
        }

        const savedLogs = readAccountValue('logs');
        try {
          setLogs(savedLogs ? JSON.parse(savedLogs) : []);
        } catch (error) {
          console.error('Saved activity log is invalid:', error);
          setLogs([]);
        }

        const savedMonth = readAccountValue(currentMonthKey);
        try {
          setMonthLogs(savedMonth ? JSON.parse(savedMonth) : {});
        } catch (error) {
          console.error('Saved calendar data is invalid:', error);
          setMonthLogs({});
        }

        setIsRegistered(
          metadata.remind_registered === true ||
          readAccountValue('registered') === 'true'
        );
        setUserDataReady(true);
      }, [authUser?.id]);

      useEffect(() => {
        if (!isRegistered) return;
        const updateTimer = () => {
          const now = Date.now();
          const diff = Math.max(0, Math.floor((now - startTime) / 1000));
          setElapsedSeconds(diff);
        };
        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, [startTime, isRegistered]);

      const days = Math.floor(elapsedSeconds / (3600 * 24));
      const hours = Math.floor((elapsedSeconds % (3600 * 24)) / 3600);
      const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      const seconds = elapsedSeconds % 60;
      const circleProgress = (seconds / 60) * 100;

      const handleGoogleLogin = async () => {
        setAuthError('');
        setAuthSubmitting(true);

        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: 'https://remind-bay.vercel.app/'
            }
          });

          if (error) {
            console.error('Google sign-in failed:', error.message);
            setAuthError('לא הצלחנו להתחבר עם Google. בדוק שספק Google מופעל בהגדרות Supabase.');
            setAuthSubmitting(false);
          }
        } catch (error) {
          console.error('Google sign-in request failed:', error);
          setAuthError('לא הצלחנו להתחבר עם Google. נסה שוב.');
          setAuthSubmitting(false);
        }
      };

      const handleSignOut = async () => {
        setAuthError('');
        setAuthSubmitting(true);
        try {
          const { error } = await supabase.auth.signOut({ scope: 'local' });
          if (error) {
            console.error('Supabase sign out failed:', error.message);
            setAuthError('ההתנתקות נכשלה. נסה שוב.');
          }
        } catch (error) {
          console.error('Supabase sign out request failed:', error);
          setAuthError('ההתנתקות נכשלה. נסה שוב.');
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleDayAnswer = (dayNum, answer) => {
        const currentStatus = monthLogs[dayNum];
        let updated = { ...monthLogs };

        if (currentStatus === answer) {
          delete updated[dayNum];
        } else {
          updated[dayNum] = answer;
          if (answer === 'yes') {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
        }
        setMonthLogs(updated);
        localStorage.setItem(accountStorageKey(currentMonthKey), JSON.stringify(updated));
        setShowDayModal(false);
      };

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        setIsDrawing(true);
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        ctx.beginPath();
        ctx.moveTo((clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY);
        ctx.strokeStyle = '#007aff';
        ctx.lineWidth = 3 * scaleX;
        ctx.lineCap = 'round';
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        ctx.lineTo((clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY);
        ctx.stroke();
        setHasSigned(true);
      };

      const stopDrawing = () => {
        if (!isDrawing) return;
        setIsDrawing(false);
        const canvas = canvasRef.current;
        if (canvas) {
          setProfile(prev => ({ ...prev, signatureDataUrl: canvas.toDataURL() }));
        }
      };

      const handleFinishOnboarding = async () => {
        setOnboardingError('');
        const now = Date.now();
        const updatedProfile = {
          ...profile,
          name: profile.name.trim(),
          promise: profile.promise.trim(),
          email: authUser.email || ''
        };
        try {
          const { data, error } = await supabase.auth.updateUser({
            data: {
              name: updatedProfile.name,
              promise: updatedProfile.promise,
              remind_registered: true
            }
          });

          if (error) {
            console.error('Supabase profile update failed:', error.message);
            setOnboardingError('לא ניתן לשמור את הפרופיל כרגע. בדוק את החיבור ונסה שוב.');
            return;
          }

          setProfile(updatedProfile);
          setAuthUser(data.user);
          localStorage.setItem(accountStorageKey('registered'), 'true');
          localStorage.setItem(accountStorageKey('profile'), JSON.stringify(updatedProfile));
          if (!localStorage.getItem(accountStorageKey('streak_start'))) {
            localStorage.setItem(accountStorageKey('streak_start'), now.toString());
            setStartTime(now);
          }
          setIsRegistered(true);
        } catch (error) {
          console.error('Supabase profile update request failed:', error);
          setOnboardingError('לא ניתן לשמור את הפרופיל כרגע. בדוק את החיבור ונסה שוב.');
        }
      };

      const handleConfirmReset = () => {
        const newLog = {
          id: Date.now().toString(),
          date: new Date().toLocaleString('he-IL'),
          category: selectedCategory,
          reason: resetReason.trim() ? resetReason : 'ללא פירוט',
        };
        const updatedLogs = [newLog, ...logs];
        const newStartTime = Date.now();
        setLogs(updatedLogs);
        setStartTime(newStartTime);
        localStorage.setItem(accountStorageKey('logs'), JSON.stringify(updatedLogs));
        localStorage.setItem(accountStorageKey('streak_start'), newStartTime.toString());
        setResetReason('');
        setShowResetModal(false);
      };

      const getWeeklyPosition = (dayIndexInWeek) => {
        const index = Math.max(0, Math.min(6, dayIndexInWeek));
        const leftPositions = [61.25, 58.75, 56.25, 58.75, 61.25, 58.75, 56.25];
        return {
          top: `${88 - index * (49 / 6)}%`,
          left: `${leftPositions[index]}%`
        };
      };

      const startDayOfWeek = (selectedWeek - 1) * 7 + 1;
      const daysInCurrentWeek = Array.from({ length: 7 }, (_, i) => startDayOfWeek + i).filter(d => d <= 31);

      if (authLoading || (authUser && !userDataReady)) {
        return (
          <div className={`onboarding-shell min-h-screen flex items-center justify-center p-4 ${currentTheme}`} dir="rtl">
            <div className="apple-card p-6 text-center">טוען את Remind...</div>
          </div>
        );
      }

      if (!authUser) {
        return (
          <div className={`google-auth-screen onboarding-shell min-h-screen flex items-center justify-center p-4 ${currentTheme}`} dir="rtl">
            <div className="google-auth-container apple-card shadow-2xl">
              <div className="google-auth-logo">
                <RemindLogo size="lg" />
              </div>
              <h1 className="google-auth-heading">ברוכים הבאים ל־Remind</h1>
              <p className="google-auth-caption">מרחב אישי לבניית חוסן והרגלים.<br />התחברו והמשיכו בדרך שלכם.</p>
              {authError && <p role="alert" className="text-sm text-red-500">{authError}</p>}
              <button
                type="button"
                onClick={handleGoogleLogin}
                disabled={authSubmitting}
                className="google-login-button min-h-12 disabled:opacity-50"
              >
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                  <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z" />
                  <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.74L.97 13.02C2.45 15.98 5.48 18 9 18z" />
                  <path fill="#FBBC05" d="M3.87 10.78c-.19-.53-.3-1.1-.3-1.78s.11-1.25.3-1.78L.97 4.96C.35 6.18 0 7.55 0 9s.35 2.82.97 4.04l2.9-2.26z" />
                  <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.97 4.96l2.9 2.26C4.59 5.05 6.62 3.58 9 3.58z" />
                </svg>
                <span>{authSubmitting ? 'מתחבר...' : 'התחבר באמצעות Google'}</span>
              </button>
              <div className="google-auth-note">
                <span className="material-symbols-rounded" aria-hidden="true">verified_user</span>
                <span>התחברות מאובטחת באמצעות Google</span>
              </div>
            </div>
          </div>
        );
      }

      if (!isRegistered) {
        return (
          <div className={`onboarding-shell min-h-screen flex items-center justify-center p-4 ${currentTheme}`} dir="rtl">
            <div className="onboarding-card apple-card p-8 max-w-lg w-full space-y-6 shadow-2xl">
              {onboardingStep === 1 && (
                <div className="space-y-6">
                  <div className="text-center space-y-3 flex flex-col items-center">
                    <RemindLogo size="lg" />
                    <h1 className="text-2xl font-bold pt-2">פרטי ההרשמה</h1>
                    <p className="text-sm opacity-70">{authUser.email}</p>
                  </div>
                  <div className="space-y-4">
                    <div>
                      <label className="text-sm opacity-70 block mb-1">שם מלא או כינוי</label>
                      <input
                        type="text"
                        value={profile.name}
                        readOnly={Boolean(authUser.user_metadata?.name)}
                        onChange={(e) => setProfile({...profile, name: e.target.value})}
                        placeholder="הכנס את שמך..."
                        className="w-full bg-[var(--input-bg)] border border-[var(--card-border)] rounded-xl px-4 py-3 text-base focus:outline-none focus:border-blue-500 transition-all"
                      />
                    </div>
                    <div>
                      <label className="text-sm opacity-70 block mb-1">ההבטחה שלי לעצמי</label>
                      <textarea
                        value={profile.promise}
                        readOnly={Boolean(authUser.user_metadata?.promise)}
                        onChange={(e) => setProfile({...profile, promise: e.target.value})}
                        placeholder="אני מתחייב/ת לעצמי..."
                        className="w-full min-h-24 bg-[var(--input-bg)] border border-[var(--card-border)] rounded-xl p-4 text-base resize-y focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>
                  <button
                    disabled={!profile.name.trim() || !profile.promise.trim()}
                    onClick={() => setOnboardingStep(2)}
                    className="w-full py-3.5 rounded-xl bg-[#007aff] hover:bg-[#0063cc] disabled:opacity-50 text-white font-medium text-base transition-all shadow-lg shadow-blue-500/20 active:scale-95"
                  >
                    המשך לחתימה
                  </button>
                </div>
              )}

              {onboardingStep === 2 && (
                <div className="space-y-5">
                  <h2 className="text-xl font-bold text-center">חתימה דיגיטלית</h2>
                  <p className="text-sm opacity-70 text-center">{profile.name}, אשר/י את תחילת הדרך שלך ב־Remind.</p>
                  <div>
                    <label className="text-sm opacity-70 block mb-1">חתימה</label>
                    <div className="bg-[var(--input-bg)] border border-[var(--card-border)] rounded-xl overflow-hidden relative touch-none">
                      <canvas ref={canvasRef} width={400} height={110} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} onTouchCancel={stopDrawing} className="w-full h-[110px] cursor-crosshair" />
                    </div>
                  </div>
                  {onboardingError && <p role="alert" className="text-sm text-red-500">{onboardingError}</p>}
                  <button
                    disabled={!hasSigned}
                    onClick={handleFinishOnboarding}
                    className="w-full py-3.5 rounded-xl bg-[#007aff] hover:bg-[#0063cc] text-white font-medium text-base disabled:opacity-50 transition-all shadow-lg shadow-blue-500/20 active:scale-95"
                  >
                    סיום וכניסה לאפליקציה
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className={`app-shell min-h-screen p-4 md:p-8 pb-32 ${currentTheme}`} dir="rtl">
          <div className="app-content max-w-4xl mx-auto space-y-6">
            
            {/* סרגל עליון */}
            <header className="app-header apple-card px-6 py-4 flex justify-between items-center relative z-20">
              <RemindLogo size="sm" />
              <div className="flex items-center gap-3">
                <span className="greeting-pill text-xs text-blue-500 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20 font-medium">
                  שלום, {profile.name}
                </span>
              </div>
            </header>

            {/* --- מסך 1: טיימר --- */}
            {activeTab === 'timer' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="timer-card apple-card p-8 text-center space-y-8 flex flex-col items-center">
                  <div className="flex justify-between w-full items-center">
                    <span className="text-xs font-semibold opacity-60 uppercase tracking-wider">טיימר רצף נקי</span>
                    <span className="text-xs opacity-50">מצב מאובטח</span>
                  </div>

                  <div onClick={() => setShowResetModal(true)} className="timer-clock relative w-64 h-64 rounded-full flex items-center justify-center cursor-pointer group transition-transform hover:scale-105" title="לחץ לאיפוס">
                    <div className="absolute inset-0 rounded-full border-4 opacity-15"></div>
                    <svg className="absolute inset-0 w-full h-full -rotate-90">
                      <circle cx="128" cy="128" r="120" stroke="currentColor" strokeWidth="6" fill="transparent" className="text-blue-500 transition-all duration-500" strokeDasharray={754} strokeDashoffset={754 - (754 * circleProgress) / 100} />
                    </svg>
                    <div className="absolute inset-2 rounded-full bg-[var(--card-bg)] flex flex-col items-center justify-center space-y-1 shadow-inner group-hover:opacity-100 transition-opacity">
                      <div className="text-3xl md:text-4xl font-black">{days} <span className="text-xs font-normal opacity-70">ימים</span></div>
                      <div className="text-lg font-bold opacity-80">{String(hours).padStart(2, '0')}:{String(minutes).padStart(2, '0')}:{String(seconds).padStart(2, '0')}</div>
                      <div className="text-[10px] text-blue-500 font-semibold pt-1">לחץ לאיפוס טיימר</div>
                    </div>
                  </div>
                </div>

              </div>
            )}

            {/* --- מסך 2: מפת טיפוס ההר המסונכרנת עם הטיימר (מסלול Z מושלם) --- */}
            {activeTab === 'calendar' && (
              <div className="space-y-4">
                
                {/* סרגל בחירת שבועות */}
                <div className="week-selector flex justify-center gap-2 apple-card p-2">
                  {[1, 2, 3, 4].map(wNum => (
                    <button
                      key={wNum}
                      onClick={() => setSelectedWeek(wNum)}
                      className={`week-option px-4 py-2 rounded-xl text-xs font-bold transition-all ${selectedWeek === wNum ? 'bg-[#007aff] text-white shadow-lg shadow-blue-500/20' : 'opacity-70 hover:opacity-100'}`}
                    >
                      שבוע {wNum}
                    </button>
                  ))}
                </div>

                {/* מיכל ההר הווקטורי */}
                <div className="mountain-map relative w-full h-[540px] rounded-3xl overflow-hidden border border-[var(--card-border)] shadow-2xl" style={{ background: 'linear-gradient(180deg, #1a1c2e 0%, #394168 60%, #5d6795 100%)' }}>
                  
                  <div className="sun-glow"></div>
                  <div className="cloud cloud-1">☁️</div>
                  <div className="cloud cloud-2">☁️</div>

                  <svg className="mountain-svg" viewBox="0 0 800 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="100,600 350,250 600,600" fill="#2d325a" opacity="0.7" />
                    <polygon points="400,600 600,300 800,600" fill="#2d325a" opacity="0.5" />
                    <polygon points="150,600 450,150 750,600" fill="#3c437a" />
                    <polygon points="400,225 450,150 500,225 465,210 450,230 435,210" fill="#ffffff" />
                    <polygon points="-50,600 200,380 450,600" fill="#23274a" />
                  </svg>

                  <div className="absolute top-[25%] left-[56.25%] z-20">
                    <svg className="mountain-peak-flag" viewBox="0 0 28 36" aria-label="דגל פסגת ההר">
                      <path d="M14 1v35" fill="none" stroke="white" strokeWidth="2" />
                      <path className="mountain-peak-flag-cloth" d="M15 2 27 6 15 11Z" fill="#ef4444" />
                    </svg>
                    <span className="absolute top-1 left-1/2 -translate-x-1/2 whitespace-nowrap text-[9px] bg-blue-500 text-white px-2.5 py-0.5 rounded-full font-black uppercase shadow-lg">פסגת השבוע</span>
                  </div>

                  {daysInCurrentWeek.map((dayNum, idx) => {
                    const pos = getWeeklyPosition(idx);
                    
                    const isPassedByTimer = dayNum <= days;
                    const manualStatus = monthLogs[dayNum];
                    const isLockedByTimer = dayNum > (days + 1);

                    let btnStyle = "bg-zinc-900/85 border-white/25 text-white hover:scale-110";
                    let content = <span className="text-sm font-bold">{dayNum}</span>;

                    if (isLockedByTimer) {
                      btnStyle = "bg-zinc-900/40 border-white/10 text-zinc-500 cursor-not-allowed opacity-50";
                      content = <span className="material-symbols-rounded text-base">lock</span>;
                    } else if (manualStatus === 'yes' || (isPassedByTimer && manualStatus !== 'no')) {
                      btnStyle = "bg-emerald-500 border-emerald-300 text-zinc-950 font-black shadow-lg shadow-emerald-500/50 ring-4 ring-emerald-400/30 scale-110";
                      content = <span className="material-symbols-rounded text-lg font-bold">check</span>;
                    } else if (manualStatus === 'no') {
                      btnStyle = "bg-rose-600/90 border-rose-400 text-white font-bold shadow-lg shadow-rose-500/40";
                      content = <span className="material-symbols-rounded text-lg font-bold">close</span>;
                    }

                    return (
                      <button
                        key={dayNum}
                        onClick={() => {
                          setSelectedDay(dayNum);
                          setShowDayModal(true);
                        }}
                        style={{ top: pos.top, left: pos.left }}
                        className={`weekly-day-button absolute -translate-x-1/2 -translate-y-1/2 w-12 h-12 rounded-2xl border-2 flex items-center justify-center transition-all duration-300 z-10 ${btnStyle}`}
                        title={`יום ${dayNum}`}
                      >
                        {content}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* --- מסך 3: הגדרות --- */}
            {activeTab === 'settings' && (
              <div className="settings-panel apple-card p-6 space-y-6 text-xs">
                <h3 className="text-lg font-bold flex items-center gap-2">
                  <span className="material-symbols-rounded text-blue-500">settings</span> הגדרות מערכת ועיצוב
                </h3>

                <div>
                  <label className="opacity-70 block mb-2 font-medium">מצב תצוגה (אוטומטי / ידני)</label>
                  <div className="settings-theme-options grid grid-cols-3 gap-3">
                    <button onClick={() => { setThemeMode('auto'); localStorage.setItem(accountStorageKey('theme_mode'), 'auto'); }} className={`p-3 rounded-xl border text-center transition-all ${themeMode === 'auto' ? 'border-blue-500 bg-blue-500/10 font-bold' : 'border-[var(--card-border)]'}`}>
                      אוטומטי (לפי שעה)
                    </button>
                    <button onClick={() => { setThemeMode('light'); localStorage.setItem(accountStorageKey('theme_mode'), 'light'); }} className={`p-3 rounded-xl border text-center transition-all ${themeMode === 'light' ? 'border-blue-500 bg-blue-500/10 font-bold' : 'border-[var(--card-border)]'}`}>
                      מצב בהיר
                    </button>
                    <button onClick={() => { setThemeMode('dark'); localStorage.setItem(accountStorageKey('theme_mode'), 'dark'); }} className={`p-3 rounded-xl border text-center transition-all ${themeMode === 'dark' ? 'border-blue-500 bg-blue-500/10 font-bold' : 'border-[var(--card-border)]'}`}>
                      מצב כהה
                    </button>
                  </div>
                </div>

                <div className="p-4 rounded-2xl bg-[var(--input-bg)] border border-[var(--card-border)] space-y-3">
                  <div>
                    <label className="opacity-70 block mb-1">חשבון מחובר</label>
                    <p className="text-sm font-medium break-all">{authUser.email}</p>
                  </div>
                  {authError && <p role="alert" className="text-sm text-red-500">{authError}</p>}
                  <button
                    onClick={handleSignOut}
                    disabled={authSubmitting}
                    className="w-full min-h-11 px-4 py-2.5 rounded-xl border border-rose-500/30 text-rose-600 font-medium transition-all active:scale-95 disabled:opacity-50"
                  >
                    {authSubmitting ? 'מתנתק...' : 'התנתקות וחזרה למסך הכניסה'}
                  </button>
                </div>

                <div>
                  <label className="opacity-70 block mb-1">שם מלא (נקבע בהרשמה)</label>
                  <input type="text" value={profile.name} readOnly className="w-full bg-[var(--input-bg)] border border-[var(--card-border)] rounded-xl px-3 py-2.5 text-sm opacity-80" />
                </div>
                <div>
                  <label className="opacity-70 block mb-1">ההבטחה שלי (נקבעה בהרשמה)</label>
                  <textarea value={profile.promise} readOnly className="w-full bg-[var(--input-bg)] border border-[var(--card-border)] rounded-xl p-3 text-xs h-16 resize-none opacity-80" />
                </div>
              </div>
            )}

          </div>

          {/* --- סרגל הניווט המרחף של אפל בתחתית --- */}
          <div className="nav-container">
            <nav className="apple-navbar">
              <a href="#" onClick={(e) => { e.preventDefault(); setActiveTab('timer'); }} className={`nav-item ${activeTab === 'timer' ? 'active' : ''}`}>
                <span className="material-symbols-rounded text-xl">home</span>
                <span className="label">בית</span>
              </a>
              <a href="#" onClick={(e) => { e.preventDefault(); setActiveTab('calendar'); }} className={`nav-item ${activeTab === 'calendar' ? 'active' : ''}`}>
                <span className="material-symbols-rounded text-xl">landscape</span>
                <span className="label">ההר</span>
              </a>
              <a href="#" onClick={(e) => { e.preventDefault(); setActiveTab('settings'); }} className={`nav-item ${activeTab === 'settings' ? 'active' : ''}`}>
                <span className="material-symbols-rounded text-xl">settings</span>
                <span className="label">הגדרות</span>
              </a>
            </nav>
          </div>

          {/* --- מודאל שאלון יומי --- */}
          {showDayModal && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="modal-panel apple-card p-6 max-w-sm w-full space-y-6 text-center shadow-2xl">
                <div className="space-y-2">
                  <span className="text-xs text-blue-500 font-bold uppercase tracking-wider">יומן טיפוס ההר</span>
                  <h3 className="text-xl font-bold">האם עמדת ביעד ביום {selectedDay}?</h3>
                  <p className="text-xs opacity-70">בחירה מחדש תעדכן את הסטטוס.</p>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button onClick={() => handleDayAnswer(selectedDay, 'yes')} className="py-3.5 rounded-2xl font-bold text-sm bg-emerald-500 hover:bg-emerald-600 text-zinc-950 transition-all shadow-md active:scale-95">
                    ✅ כן, עמדתי!
                  </button>
                  <button onClick={() => handleDayAnswer(selectedDay, 'no')} className="py-3.5 rounded-2xl font-bold text-sm bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/30 text-rose-500 transition-all active:scale-95">
                    ❌ פספסתי
                  </button>
                </div>

                <button onClick={() => setShowDayModal(false)} className="text-xs opacity-60 hover:opacity-100 pt-2 block mx-auto">סגור חלון</button>
              </div>
            </div>
          )}

          {/* מודאל איפוס טיימר */}
          {showResetModal && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="modal-panel apple-card p-6 max-w-md w-full space-y-4">
                <h3 className="text-lg font-bold">דיווח נפילה ואיפוס טיימר</h3>
                <div className="space-y-2">
                  {COMMON_TRIGGER_REASONS.map((cat) => (
                    <button key={cat} onClick={() => setSelectedCategory(cat)} className={`w-full p-2.5 rounded-xl border text-right text-xs transition-all ${selectedCategory === cat ? 'border-blue-500 font-bold text-blue-500 bg-blue-500/10' : 'border-[var(--card-border)] opacity-70'}`}>
                      {cat}
                    </button>
                  ))}
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={handleConfirmReset} className="flex-1 py-2.5 rounded-xl bg-blue-500 text-white font-medium text-xs shadow-md active:scale-95">אישור ואיפוס</button>
                  <button onClick={() => setShowResetModal(false)} className="px-4 py-2.5 rounded-xl bg-[var(--input-bg)] opacity-70 hover:opacity-100 font-medium text-xs">ביטול</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RemindApp />);
  </script>
</body>
</html>
